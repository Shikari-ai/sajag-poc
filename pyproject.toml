[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sajag-poc"
version = "0.1.0"
description = "Zero-tap scam detection for messages and links, sized for a phone."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["on-device", "scam-detection", "sms", "phishing", "edge-ai", "india"]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sajag = "sajag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
